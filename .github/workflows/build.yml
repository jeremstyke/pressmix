name: Actus RSS + build du site
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "data/news.json"]
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Récupérer les flux RSS
        run: python3 fetch_feeds.py
      - name: Générer le site
        run: python3 build.py
      - name: Publier
        run: |
          git config user.name "lemagutile-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A docs data
          git diff --cached --quiet || git commit -m "Mise à jour du site $(date -u +'%Y-%m-%d %H:%M')"
          git pull --rebase origin main || true
          git push
